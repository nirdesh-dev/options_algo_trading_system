# Example configuration for the data loader
data_dir: "stock_data"

# Underlying symbols to load (required)
underlying_symbols:
  - "SPX"

# # Date range filter (optional)
# date_range:
#   start: "2013-01-02"
#   end: "2013-12-31"

# # Option types to include (optional)
# # Valid values: "call", "put"
# option_types:
#   - "call"
#   - "put"

# # Strike price range filter (optional)
# strike_range:
#   min: 1400.0
#   max: 1600.0

# # Volume filter (optional)
# volume_filter:
#   min: 10      # Minimum volume required
#   max: ~       # No maximum limit (use ~ for null)

# # Open interest filter (optional)
# open_interest_filter:
#   min: 50      # Minimum open interest required
#   max: ~       # No maximum limit

# # Greeks and IV filters (optional)
# greeks_filter:
#   # Delta range filter
#   delta_range:
#     min: -1.0
#     max: 1.0
  
#   # Gamma range filter (optional)
#   gamma_range:
#     min: ~     # No minimum limit
#     max: ~     # No maximum limit
  
#   # Theta range filter (optional)
#   theta_range:
#     min: ~     # No minimum limit
#     max: ~     # No maximum limit
  
#   # Vega range filter (optional)
#   vega_range:
#     min: ~     # No minimum limit
#     max: ~     # No maximum limit
  
#   # Implied volatility range filter
#   iv_range:
#     min: 0.05  # Minimum 5% IV
#     max: 2.0   # Maximum 200% IV